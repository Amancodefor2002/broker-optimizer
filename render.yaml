# Render Blueprint. In the Render dashboard choose New > Blueprint and pick
# this repository; Render reads this file and creates the web service.
services:
  - type: web
    name: loadlens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Render tells the app which port to listen on through $PORT.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit  # every push to GitHub redeploys
